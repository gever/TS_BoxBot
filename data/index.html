<!DOCTYPE html>
<html>

<head>
  <title>BOXBOT</title>
  <style>
    .centered-svg {
      display: block;
      margin-left: auto;
      margin-right: auto;
      width: 90%;
      /* Adjust width as needed */
    }
  </style>
</head>

<body>
  <div class="centered-svg">
    <object data="boxbot-index-panel.svg" type="image/svg+xml" class="centered-svg">
      <img src="fallback.png" alt="SVG image">
    </object>
  </div>
  <script>
    function launch(dest) {
      if (dest == "program") {
        window.location.href = "blox.html";
      }
      if (dest == "plan") {
        window.location.href = "plan.html";
      }
      if (dest == "settings") {
        window.location.href = "settings.html";
      }
      if (dest == "drive") {
        window.location.href = "drive.html";
      }
    }
  </script>
</body>

</html>
