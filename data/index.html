<!DOCTYPE html>
<html>

<head>
  <title>BOXBOT</title>
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    td {
      padding: 10px;
      border: 1px solid #000;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 20px;
      background-color: #dc9353;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: #be5900;
    }
    .centered {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
  <div class="centered">
    <h1 style="text-align: center;">boxbot</h1>
    <img src="boxbot_icon.png" style="display: block; margin: auto; width: 100px;">
    <div>&nbsp;</div>
    <table>
      <tr>
        <td>
          <button onclick="launch('program')">Program</button>
        </td>
        <td>
          Write and run programs.
        </td>
      </tr>
      <tr>
        <td>
          <button onclick="launch('plan')">Plan</button>
        </td>
        <td>
          Plan and execute tasks.
        </td>
      </tr>
      <tr>
        <td>
          <button onclick="launch('settings')">Settings</button>
        </td>
        <td>
          Configure boxbot settings.
        </td>
      </tr>
    </table>
  </div>
  <script>
    function launch(dest) {
      if (dest == "program") {
        window.location.href = "blox.html";
      }
      if (dest == "plan") {
        window.location.href = "plan.html";
      }
      if (dest == "settings") {
        window.location.href = "settings.html";
      }
      if (dest == "drive") {
        window.location.href = "drive.html";
      }
    }
  </script>
</body>

</html>
