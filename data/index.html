<!DOCTYPE html>
<html>

<head>
  <title>BOXBOT</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    body {
      background-color: #f0f0f0;
      font-family: Arial, sans-serif;
      font-size: 24px; /* 50% larger than default 16px */
    }
    table {
      border-collapse: collapse;
      width: 100%;
      max-width: 900px; /* 600px * 1.5 */
      margin: auto;
    }

    td {
      padding: 15px; /* 10px * 1.5 */
      border: 1px solid #000;
    }

    button {
      width: 100%;
      padding: 15px; /* 10px * 1.5 */
      font-size: 30px; /* 20px * 1.5 */
      background-color: #dc9353;
      color: white;
      border: none;
      border-radius: 8px; /* slightly soften edges for modern look */
      cursor: pointer;
    }

    button:hover {
      background-color: #be5900;
    }
    .centered {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      max-width: 900px;
    }
  </style>
</head>

<body onload="getVersion()">
  <div class="centered">
    <h1 style="text-align: center; margin-bottom: 10px;">boxbot</h1>
    <img src="boxbot_icon.png" style="display: block; margin: auto; width: 150px;">
    <div id="version_txt" style="text-align: center; width: 100%; margin-top: 10px;">---</div>
    <div>&nbsp;</div>
    <table>
      <tr>
        <td style="width: 40%;">
          <button onclick="launch('program')">Program</button>
        </td>
        <td>
          Write and run programs.
        </td>
      </tr>
      <tr>
        <td>
          <button onclick="launch('plan')">Plan</button>
        </td>
        <td>
          Plan and execute tasks.
        </td>
      </tr>
      <tr>
        <td>
          <button onclick="launch('drive')">Drive</button>
        </td>
        <td>
          Manual remote control.
        </td>
      </tr>
      <tr>
        <td>
          <button onclick="launch('settings')">Settings</button>
        </td>
        <td>
          Configure boxbot settings.
        </td>
      </tr>
    </table>
  </div>
  <script>
    function launch(dest) {
      if (dest == "program") {
        window.location.href = "blox.html";
      }
      if (dest == "plan") {
        window.location.href = "motion.html";
      }
      if (dest == "settings") {
        window.location.href = "settings.html";
      }
      if (dest == "drive") {
        window.location.href = "drive.html";
      }
    }
    // get the current version of the app
    function getVersion() {
    fetch('/version')
      .then(response => response.text())
      .then(text => {
        console.log('Current version: ' + text);
        document.getElementById('version_txt').innerText = 'Version: ' + text;
      });
    }
  </script>
</body>

</html>
