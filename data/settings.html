<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Boxbot Settings</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body style="margin-left:15px;">
  <div>
    <div id="logo">
      <img src="boxbot_icon.png" onclick="document.location='index.html'" width="50px" height="50px"/>
      Boxbot v0.6
    </div>
    <h1>Select a configuration variable:</h1>
    <form id="varform" method="post">
      <label for="setting">Setting:</label>
      <select id="label" name="label">
        <option value="motor-step-rate">motor-step-rate</option>
        <option value="linear-turn-fudge">linear-turn-fudge</option>
        <option value="linear-motion-fudge">linear-motion-fudge</option>
        <option value="invert-direction">invert-direction</option>
        <option value="invert-turn">invert-turn</option>
        <option value="use-wifi">use-wifi</option>
        <option value="ap-ssid">ap-ssid</option>
        <option value="ap-password">ap-password</option>
        <option value="network-ssid">network-ssid</option>
        <option value="network-password">network-password</option>
      </select>
      <label for="value">Value:</label>
      <input type="text" id="value" name="value" required>
      <input type="submit" value="Set">
    </form>  
  </div>
  <div>
    <h1>Current Settings</h1>
    <iframe id="varview" src="/getvars" width="100%" height="100%"></iframe>
  </div>
  <script>
    var form = document.getElementById('varform');
    form.onsubmit = function(e) {
      e.preventDefault();
      var label = document.getElementById('label').value;
      var value = document.getElementById('value').value;
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '/setvar', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.send('label=' + label + '&value=' + value);
      xhr.onreadystatechange = function() {
        if (xhr.readyState == 4 && xhr.status == 200) {
          console.log(xhr.responseText);
        }
      }
      // refresh the varview iframe
      document.getElementById('varview').src = document.getElementById('varview').src;
    }
  </script>
</body>
</html>
