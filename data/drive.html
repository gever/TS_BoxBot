<!DOCTYPE html>
<html>
<head>
    <title>Boxbot Controller</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F3F3F3;
            margin: 0;
        }
        .controller {
            border: 1px solid #333;
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFF;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.2);
        }
        .direction-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }
        button {
            border: none;
            background-color: #333;
            color: #FFF;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>
    <div class="controller">
        <div style="align-items: center;justify-content: center;">
            <img src="boxbot_icon.png" width="32" height="32"/> 
        </div>
        <h2>Boxbot Controller v0.5</h2>
        <div class="direction-buttons">
            <button id="fwd">Forward</button>
        </div>
        <div class="direction-buttons">
            <button id="left">Left</button>
            <button id="stop">Stop</button>
            <button id="right">Right</button>
        </div>
        <div class="direction-buttons">
            <button id="bwd">Backward</button>
        </div>
<!--
        <div>
            <button onclick="servoSetAngle(0)">0&deg;</button>
            <button onclick="servoSetAngle(10)">10&deg;</button>
            <button onclick="servoSetAngle(20)">20&deg;</button>
            <button onclick="servoSetAngle(30)">30&deg;</button>
            <button onclick="servoSetAngle(40)">40&deg;</button>
            <button onclick="servoSetAngle(50)">50&deg;</button>
            <button onclick="servoSetAngle(60)">60&deg;</button>
            <button onclick="servoSetAngle(70)">70&deg;</button>
            <button onclick="servoSetAngle(80)">80&deg;</button>
            <button onclick="servoSetAngle(90)">90&deg;</button>
        </div>
-->
        </div>
    </div>

    <script>
        // Assigning event listeners to the buttons
        function servoSetAngle(angle) {
            fetch("/servoGo?pin=12&angle=" + angle);
        }

        document.getElementById('fwd').addEventListener('click', function() {
            console.log('Fwd');
            fetch("/move?dist=100");
        });

        document.getElementById('bwd').addEventListener('click', function() {
            console.log('Bwd');
            fetch("/move?dist=-100");
        });

        document.getElementById('left').addEventListener('click', function() {
            console.log('Left');
            fetch("/turn?angle=-180");
        });

        document.getElementById('right').addEventListener('click', function() {
            console.log('Right');
            fetch("/turn?angle=180");
        });

        document.getElementById('stop').addEventListener('click', function() {
            console.log('Stopping');
            fetch("/stop");
        });

        // Keyboard controls
        document.addEventListener('keydown', (event) => {
            // ignore the keypress if it was in an input field
            if (event.target.tagName === 'INPUT') {
                return;
            }

            switch (event.code) {
                case 'ArrowUp':
                fetch("/move?dist=100");
                break;
                case 'ArrowDown':
                fetch("/move?dist=-100");
                break;
                case 'ArrowLeft':
                fetch("/turn?angle=-180");
                break;
                case 'ArrowRight':
                fetch("/turn?angle=180");
                break;
                case 'Space':
                fetch("/stop");
                break;
                case 'Digit0':
                    fetch("/servoGo?pin=12&angle=0");
                    break;
                case 'Digit1':
                    fetch("/servoGo?pin=12&angle=10");
                    break;
                case 'Digit2':
                    fetch("/servoGo?pin=12&angle=20");
                    break;
                case 'Digit3':
                    fetch("/servoGo?pin=12&angle=30");
                    break;
                case 'Digit4':
                    fetch("/servoGo?pin=12&angle=40");
                    break;
                case 'Digit5':
                    fetch("/servoGo?pin=12&angle=50");
                    break;
                case 'Digit6':
                    fetch("/servoGo?pin=12&angle=60");
                    break;
                case 'Digit7':
                    fetch("/servoGo?pin=12&angle=70");
                    break;
                case 'Digit8':
                    fetch("/servoGo?pin=12&angle=80");
                    break;
                case 'Digit9':
                    fetch("/servoGo?pin=12&angle=90");
                    break;
            }
        });
    </script>
</body>
</html>
