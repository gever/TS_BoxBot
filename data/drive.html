<!DOCTYPE html>
<html>
<head>
    <title>Boxbot Controller</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --fwd-color:   #6ee86e;
            --fwd-dark:    #3bb83b;
            --bwd-color:   #64d4f5;
            --bwd-dark:    #1fa8d4;
            --left-color:  #f56080;
            --left-dark:   #d42848;
            --right-color: #ffa040;
            --right-dark:  #d87010;
            --stop-color:  #ffaaaa;
            --stop-dark:   #c85050;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F3F3F3;
            margin: 0;
            overflow: hidden; /* Prevent scrolling when interacting */
        }
        .controller {
            border: 1px solid #333;
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #FFF;
            box-shadow: 0px 0px 10px 0px rgba(0,0,0,0.2);
        }
        .direction-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }
        button {
            border: none;
            color: #222;
            padding: 10px 20px;
            margin: 10px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.18);
            transition: transform 0.08s, box-shadow 0.08s, filter 0.08s;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            touch-action: manipulation; /* Improved touch behavior */
        }
        /* Active state for visual feedback */
        button:active, button.active-press {
            transform: translateY(3px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.18);
            filter: brightness(0.9);
        }
        
        #fwd { background-color: var(--fwd-color); border-bottom: 4px solid var(--fwd-dark); }
        #bwd { background-color: var(--bwd-color); border-bottom: 4px solid var(--bwd-dark); }
        #left { background-color: var(--left-color); border-bottom: 4px solid var(--left-dark); }
        #right { background-color: var(--right-color); border-bottom: 4px solid var(--right-dark); }
        #stop { background-color: var(--stop-color); border-bottom: 4px solid var(--stop-dark); }

        /* Scale UI for tablets and smaller screens */
        @media (max-width: 768px) {
            button {
                padding: 25px 50px;
                font-size: 24px;
                margin: 15px;
            }
            .controller {
                padding: 40px;
            }
            h2 {
                font-size: 32px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="controller">
        <div style="align-items: center;justify-content: center;">
            <img src="boxbot_icon.png" onclick="document.location='index.html'" width="50px" height="50px"/>
        </div>
        <h2>Boxbot Stepper<br/>Drive Controller</h2>
        <div class="direction-buttons">
            <button id="fwd">Forward</button>
        </div>
        <div class="direction-buttons">
            <button id="left">Left</button>
            <button id="stop">Stop</button>
            <button id="right">Right</button>
        </div>
        <div class="direction-buttons">
            <button id="bwd">Backward</button>
        </div>
    </div>

    <script>
        var DEFAULT_MOVE = 2;
        var DEFAULT_TURN = 5;
        // Assigning event listeners to the buttons
        function servoSetAngle(angle) {
            fetch("/servoGo?pin=12&angle=" + angle);
        }

        var activeCommand = null;
        var isRunning = false;
        var checkBusyTimeout = null;

        async function executeCommand() {
            if (!isRunning || !activeCommand) return;
            
            try {
                let busyRes = await fetch("/busy");
                let busyData = await busyRes.json();
                
                if (!busyData.busy) {
                    await fetch(activeCommand);
                }
            } catch(e) {
                console.error("Error checking busy status:", e);
            }
            
            if (isRunning) {
                checkBusyTimeout = setTimeout(executeCommand, 50);
            }
        }

        function startCommand(cmdUrl) {
            if (isRunning && activeCommand === cmdUrl) return;
            isRunning = true;
            activeCommand = cmdUrl;
            clearTimeout(checkBusyTimeout);
            executeCommand();
        }

        function stopCommand() {
            if (!isRunning) return;
            isRunning = false;
            activeCommand = null;
            clearTimeout(checkBusyTimeout);
            fetch("/stop");
        }

        function setButtonActiveState(id, isActive) {
            var btn = document.getElementById(id);
            if (btn) {
                if (isActive) btn.classList.add('active-press');
                else btn.classList.remove('active-press');
            }
        }

        function bindButton(id, cmdUrl) {
            var btn = document.getElementById(id);
            if (!btn) return;
            
            var pressAction = function(e) {
                e.preventDefault();
                setButtonActiveState(id, true);
                startCommand(cmdUrl);
            };
            
            var releaseAction = function(e) {
                e.preventDefault();
                setButtonActiveState(id, false);
                stopCommand();
            };

            // Mouse events
            btn.addEventListener('mousedown', pressAction);
            btn.addEventListener('mouseup', releaseAction);
            btn.addEventListener('mouseleave', function(e) {
                setButtonActiveState(id, false);
                if (isRunning && activeCommand === cmdUrl) stopCommand();
            });

            // Touch events
            btn.addEventListener('touchstart', pressAction, {passive: false});
            btn.addEventListener('touchend', releaseAction, {passive: false});
            btn.addEventListener('touchcancel', releaseAction, {passive: false});
        }

        bindButton('fwd', "/move?dist=" + DEFAULT_MOVE);
        bindButton('bwd', "/move?dist=-" + DEFAULT_MOVE);
        bindButton('left', "/turn?angle=-" + DEFAULT_TURN);
        bindButton('right', "/turn?angle=" + DEFAULT_TURN);

        // Explicit stop button handling
        var stopBtn = document.getElementById('stop');
        var manualStopAction = function(e) {
            e.preventDefault();
            setButtonActiveState('stop', true);
            stopCommand();
            fetch("/stop"); // extra fetch just in case
        };
        var manualStopRelease = function(e) {
            e.preventDefault();
            setButtonActiveState('stop', false);
        };
        stopBtn.addEventListener('mousedown', manualStopAction);
        stopBtn.addEventListener('mouseup', manualStopRelease);
        stopBtn.addEventListener('mouseleave', manualStopRelease);
        stopBtn.addEventListener('touchstart', manualStopAction, {passive: false});
        stopBtn.addEventListener('touchend', manualStopRelease, {passive: false});
        stopBtn.addEventListener('touchcancel', manualStopRelease, {passive: false});

        // Keyboard controls
        document.addEventListener('keydown', (event) => {
            // ignore the keypress if it was in an input field
            if (event.target.tagName === 'INPUT') {
                return;
            }

            if (event.repeat) return; // ignore holding down key repeatedly firing keydown

            switch (event.code) {
                case 'ArrowUp':
                setButtonActiveState('fwd', true);
                startCommand("/move?dist=" + DEFAULT_MOVE);
                break;
                case 'ArrowDown':
                setButtonActiveState('bwd', true);
                startCommand("/move?dist=-" + DEFAULT_MOVE);
                break;
                case 'ArrowLeft':
                setButtonActiveState('left', true);
                startCommand("/turn?angle=-" + DEFAULT_TURN);
                break;
                case 'ArrowRight':
                setButtonActiveState('right', true);
                startCommand("/turn?angle=" + DEFAULT_TURN);
                break;
                case 'Space':
                setButtonActiveState('stop', true);
                stopCommand();
                fetch("/stop");
                break;
                case 'Digit0':
                    fetch("/servoGo?pin=12&angle=0");
                    break;
                case 'Digit1':
                    fetch("/servoGo?pin=12&angle=10");
                    break;
                case 'Digit2':
                    fetch("/servoGo?pin=12&angle=20");
                    break;
                case 'Digit3':
                    fetch("/servoGo?pin=12&angle=30");
                    break;
                case 'Digit4':
                    fetch("/servoGo?pin=12&angle=40");
                    break;
                case 'Digit5':
                    fetch("/servoGo?pin=12&angle=50");
                    break;
                case 'Digit6':
                    fetch("/servoGo?pin=12&angle=60");
                    break;
                case 'Digit7':
                    fetch("/servoGo?pin=12&angle=70");
                    break;
                case 'Digit8':
                    fetch("/servoGo?pin=12&angle=80");
                    break;
                case 'Digit9':
                    fetch("/servoGo?pin=12&angle=90");
                    break;
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.target.tagName === 'INPUT') {
                return;
            }

            switch (event.code) {
                case 'ArrowUp':
                setButtonActiveState('fwd', false);
                stopCommand();
                break;
                case 'ArrowDown':
                setButtonActiveState('bwd', false);
                stopCommand();
                break;
                case 'ArrowLeft':
                setButtonActiveState('left', false);
                stopCommand();
                break;
                case 'ArrowRight':
                setButtonActiveState('right', false);
                stopCommand();
                break;
                case 'Space':
                setButtonActiveState('stop', false);
                break;
            }
        });
    </script>
</body>
</html>
